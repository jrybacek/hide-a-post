version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "👷 ci"
      include: scope

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # The WordPress test suite runs on PHPUnit 9 (needed for PHP 7.4).
      - dependency-name: phpunit/phpunit
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "📦️ build"
      include: scope
