name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  code-quality:
    name: WPCS & PHPStan (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run WordPress Coding Standards & PHPCompatibility
        run: composer phpcs

      - name: Run PHPStan static analysis
        run: composer phpstan

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Check the package WordPress.org receives (.gitattributes export-ignore
      # applied), so tests, tooling, and assets do not raise false positives.
      - name: Export release package
        run: |
          mkdir -p "$RUNNER_TEMP/hide-a-post"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/hide-a-post"
          find "$RUNNER_TEMP/hide-a-post" -type f | sort

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1.1.9
        with:
          # The action takes the plugin slug from this directory's name.
          build-dir: ${{ runner.temp }}/hide-a-post

  tests:
    name: Tests (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}${{ matrix.multisite == '1' && ', multisite' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wp: '7.0'
            multisite: '0'
          - php: '8.3'
            wp: '7.1'
            multisite: '1'
          - php: '8.5'
            wp: 'latest'
            multisite: '0'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_DB_HOST: 127.0.0.1:3306
      WP_DB_USER: root
      WP_DB_PASSWORD: root
      WP_DB_NAME: wordpress_test
      WP_MULTISITE: ${{ matrix.multisite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer:v2
          coverage: none

      - name: Download WordPress ${{ matrix.wp }}
        run: |
          if [ "${{ matrix.wp }}" = "latest" ]; then
            url="https://wordpress.org/latest.tar.gz"
          else
            url="https://wordpress.org/wordpress-${{ matrix.wp }}.tar.gz"
          fi
          curl -fsSL "$url" | tar -xz -C /tmp

      - name: Install Composer dependencies
        run: |
          if [ "${{ matrix.wp }}" != "latest" ]; then
            composer require --dev --no-update --no-interaction "wp-phpunit/wp-phpunit:~${{ matrix.wp }}.0"
          fi
          composer update --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: composer test
