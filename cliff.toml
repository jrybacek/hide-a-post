# git-cliff configuration for Hide A Post
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} \
            ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/jrybacek/hide-a-post/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
render_always = true

[git]
# Parse commits according to the Conventional Commits specification
conventional_commits = true
# Keep legacy pre-conventional commits (v1.0 / v1.1 history) under a fallback group
filter_unconventional = false
# Process each line of a commit as an individual commit
split_commits = false
# Strip leading Gitmojis (Unicode emojis or :shortcodes:) so Conventional Commits parsing succeeds
commit_preprocessors = [
  { pattern = '^(:[a-z0-9_+-]+:|[\p{Extended_Pictographic}\x{200D}\x{FE0F}]+)\s+', replace = "" },
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/jrybacek/hide-a-post/issues/${2}))" },
]
# Group commits by Conventional Commit type (with Gitmoji section headings)
commit_parsers = [
  { message = "^Merge (branch|pull request)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 00 -->✨ Features" },
  { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
  { message = "^security", group = "<!-- 02 -->🔒️ Security" },
  { message = "^perf", group = "<!-- 03 -->⚡️ Performance" },
  { message = "^refactor", group = "<!-- 04 -->♻️ Refactoring" },
  { message = "^docs", group = "<!-- 05 -->📝 Documentation" },
  { message = "^style", group = "<!-- 06 -->💄 Styling" },
  { message = "^test", group = "<!-- 07 -->✅ Testing" },
  { message = "^build", group = "<!-- 08 -->📦️ Build & Dependencies" },
  { message = "^ci", group = "<!-- 09 -->👷 CI/CD" },
  { message = "^chore", group = "<!-- 10 -->🔧 Miscellaneous Tasks" },
  { message = "^revert", group = "<!-- 11 -->⏪️ Reverts" },
  # Fallback for historical commits made prior to adopting Conventional Commits
  { message = ".*", group = "<!-- 12 -->📜 Legacy Changes" },
]
# Protect breaking changes from being skipped
protect_breaking_commits = false
# Filter out commits not matched by commit_parsers
filter_commits = false
# Match both legacy tags (1.0, 1.1) and SemVer tags (v2.0.0)
tag_pattern = "^v?[0-9]+\\.[0-9]+(\\.[0-9]+)?.*"
# Sort tags topologically
topo_order = false
# Sort commits inside sections from oldest to newest
sort_commits = "oldest"
